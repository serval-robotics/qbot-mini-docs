name: pages

on:
  # Manual trigger: GitHub's Pages deployment queue has stalled often enough
  # that republishing an unchanged tree needs to be possible without inventing
  # a commit to carry it.
  workflow_dispatch:

  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements.txt

      # Illegal Basis values fail here; unfilled figures are printed and
      # tolerated, so a half-characterised robot can still publish.
      - name: Check the Basis columns
        run: python3 scripts/docs_gaps.py docs

      - name: Verify the scanner itself
        run: python3 -m pytest scripts/test_docs_gaps.py -q

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The default ten-minute ceiling is the action's patience with GitHub's
      # deployment queue, not a measure of how long publishing this site takes:
      # the artifact is four megabytes. A queue that is briefly slow should not
      # read as a broken build.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
