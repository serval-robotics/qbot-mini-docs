site_name: QBot Mini
site_description: Open quadruped development platform — documentation

repo_url: https://github.com/serval-robotics/qbot-mini-docs
repo_name: qbot-mini-docs
edit_uri: edit/main/docs/

# site_url is deliberately unset while the site is being evaluated on two
# hosts at once. Setting it would emit a canonical link pointing at whichever
# host it names, from the other host. It gets set when a host is chosen.

docs_dir: docs
site_dir: _site

theme:
  name: readthedocs
  # Adds the noindex meta tag; see overrides/main.html.
  custom_dir: overrides
  highlightjs: true
  hljs_languages:
    - python
    - yaml
    - bash

# Standard Python-Markdown extensions only: the built-in theme styles these,
# and nothing here depends on a theme-specific stylesheet.
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - codehilite
  - toc:
      permalink: true

# Each page joins the tree in the commit that creates it, so a strict build
# never sees an entry pointing at a page that does not exist yet.
nav:
  - Home: index.md
  - Product:
      - Overview: product/overview.md
      - Specifications: product/specifications.md
      - Capabilities and limits: product/capabilities.md
      - Safety: product/safety.md
  - Getting started:
      - Simulation in ten minutes: getting-started/simulation.md
      - The web console: getting-started/web-console.md
      - First run on hardware: getting-started/hardware.md
  - Using the robot:
      - Conventions: using/conventions.md
      - Commanding motion: using/commanding-motion.md
      - Scenarios: using/scenarios.md
      - Recording and data: using/recording-and-data.md
  - Integration:
      - System architecture: integration/architecture.md
      - ROS 2 interface reference: integration/ros2-interface.md
      - Mounting and payload: integration/mounting-and-payload.md
      - Customization and services: integration/customization.md
  - Teaching and research:
      - Course modules: teaching/course-modules.md
      - Lab exercises: teaching/lab-exercises.md
      - Digital twin: teaching/digital-twin.md
  - Reference:
      - Build from source: reference/build-from-source.md
      - Troubleshooting: reference/troubleshooting.md
      - Roadmap: reference/roadmap.md
