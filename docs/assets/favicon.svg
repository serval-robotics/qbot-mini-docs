<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>QBot Mini documentation</title>
  <!-- A browser tab shows this at sixteen pixels beside the company's own
       favicon, so it has to be told apart from the mark rather than echo it: a
       Q for the product, drawn as geometry so no font has to be present, on the
       brand's paper with the brand's accent for the tail. -->
  <rect width="64" height="64" rx="14" fill="#0d0e12"/>
  <circle cx="30" cy="29" r="13.5" fill="none" stroke="#ffffff" stroke-width="7.5"/>
  <path d="M35 36 L46 48" fill="none" stroke="#4c86ff" stroke-width="7.5" stroke-linecap="round"/>
</svg>
