version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  # The equivalent of `mkdocs build --strict`: a broken internal link fails
  # the build rather than shipping a dead link to a reader we sent the URL to.
  fail_on_warning: true

python:
  install:
    - requirements: requirements.txt
